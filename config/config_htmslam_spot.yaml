# SLAM pipeline for the Spot dataset
#
#   pcd_htm_node  ──/spot/place_context──►  place_context_cells_node
#                                                     │
#                                      /spot/place_context_match
#                                                     ▼
#                                              pose_cells_node
#                                                     │ /spot/PoseCell/TopologicalAction
#                                                     ▼
#                                             experience_map_node
#
# External inputs expected on the namespace /spot:
#   - /spot/pointcloud  (sensor_msgs/PointCloud2)
#   - /spot/odom    (nav_msgs/Odometry)

pcd_htm_node:
  ros__parameters:
    topic_root: spot
    # pointcloud_topic: /spot/pointcloud
    #   default: <topic_root>/pointcloud
    # encoder_config: /path/to/encoder_config.json
    #   default: <package share>/config/encoder_config.json

place_context_cells_node:
  ros__parameters:
    topic_root: spot
    # place_context_topic: /spot/place_context
    #   default: <topic_root>/place_context
    match_threshold: 0.85
    hist_n_bins: 360
    hist_n_rings: 10
    hist_use_centroid: false
    hist_refine_peak: false
    min_points: 100
    sync_max_interval: 0.5

pose_cells_node:
  ros__parameters:
    pc_dim_xy: 30
    pc_dim_th: 36
    pc_w_e_dim: 7
    pc_w_i_dim: 5
    pc_w_e_var: 1
    pc_w_i_var: 2
    pc_global_inhib: 0.00002
    vt_active_decay: 1.0
    pc_vt_inject_energy: 0.15
    # 30 cells * 2 m = 60 m grid. With ~2 m per odometry message this keeps
    # the translation below 1.41 cell/step, the range where path_integration
    # weights stay non-negative.
    pc_cell_x_size: 2.0
    exp_delta_pc_threshold: 2.0
    pc_vt_restore: 0.05
    posecells_size: 250
    # Spot is holonomic: use twist.linear.y too, so the translation direction
    # is not forced along the heading.
    holonomic_odometry: true
    # Irrlicht window (enable_graphics:=true|false overrides this value)
    enable: true

experience_map_node:
  ros__parameters:
    exp_correction: 0.5
    exp_loops: 1
    exp_initial_em_deg: -83.1
    exp_map_size: 500
    export_filename: topological_map.json
    # Spot is holonomic: use twist.linear.y too, so the translation direction
    # is not forced along the heading.
    holonomic_odometry: true
    # Irrlicht window (enable_graphics:=true|false overrides this value)
    enable: true
