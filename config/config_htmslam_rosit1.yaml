# SLAM pipeline for the Spot dataset
#
#   pcd_htm_node  ──/spot/place_context──►  place_context_cells_node
#                                                     │
#                                      /spot/place_context_match
#                                                     ▼
#                                              pose_cells_node
#                                                     │ /spot/PoseCell/TopologicalAction
#                                                     ▼
#                                             experience_map_node
#
# External inputs expected on the namespace /rosi:
#   - /rosi/pointcloud  (sensor_msgs/PointCloud2)
#   - /rosi/odom    (nav_msgs/Odometry)

pcd_htm_node:
  ros__parameters:
    topic_root: rosi
    # pointcloud_topic: /rosi/pointcloud
    #   default: <topic_root>/pointcloud
    # encoder_config: /path/to/encoder_config.json
    #   default: <package share>/config/encoder_config.json

place_context_cells_node:
  ros__parameters:
    topic_root: rosi
    # place_context_topic: /rosi/place_context
    #   default: <topic_root>/place_context
    match_threshold: 0.96 #0.93
    # Templates are only created when the best overlap falls below this value.
    # Must be <= match_threshold.
    #
    # The band [new_template_threshold, match_threshold) is the hysteresis: the
    # best template id is reused so the sequence stays continuous, but it is
    # published with matched=false, so it injects no energy into the pose cells
    # and cannot close a loop. Keep the band narrow (<= 0.05): the same place
    # fluctuates by a few percent, while different places already share ~0.90 of
    # the SDR, so a wide band reuses ids of distant places.
    new_template_threshold: 0.93 #0.92
    hist_n_bins: 360
    hist_n_rings: 10
    hist_refine_peak: false
    min_points: 100
    sync_max_interval: 0.5
    # Keyframe clouds: the cloud that created each template is published on
    # <topic_root>/place_context_cloud, so the experience map can attach it to
    # the experience. Downsampled in the sensor frame (voxel grid).
    store_keyframe_clouds: true
    cloud_voxel_size: 0.15   # m
    cloud_max_points: 2000

pose_cells_node:
  ros__parameters:
    pc_dim_xy: 40
    pc_dim_th: 36
    pc_w_e_dim: 7
    pc_w_i_dim: 5
    pc_w_e_var: 1
    pc_w_i_var: 2
    pc_global_inhib: 0.00002
    vt_active_decay: 1.0
    pc_vt_inject_energy: 0.15
    # 40 cells * 1 m = 40 m torus. This bag's T265 publishes at 200 Hz while
    # moving at ~0.3 m/s, i.e. ~1.5 mm (0.0015 cell) per message, so path
    # integration is well resolved.
    pc_cell_x_size: 0.5
    exp_delta_pc_threshold: 2.0
    pc_vt_restore: 0.05
    # Reject loop closures to visual templates created less than 50 templates
    # ago (~8 s on this bag, which creates ~6.5 templates/s). Without it, the
    # template flip-flop while the robot is nearly still closes loops between
    # experiences a few centimetres apart and the map jumps backwards.
    loop_closure_vt_window: 50
    posecells_size: 250
    # Spot is holonomic: use twist.linear.y too, so the translation direction
    # is not forced along the heading.
    holonomic_odometry: false
    # Irrlicht window (enable_graphics:=true|false overrides this value)
    enable: true

experience_map_node:
  ros__parameters:
    exp_correction: 0.5
    exp_loops: 2
    exp_initial_em_deg: 90.0
    exp_map_size: 500
    export_filename: topological_map.json
    # Spot is holonomic: use twist.linear.y too, so the translation direction
    # is not forced along the heading.
    holonomic_odometry: false
    # Irrlicht window (enable_graphics:=true|false overrides this value)
    enable: true

    # ---- Keyframe cloud visualization ----
    store_keyframe_clouds: true
    # Frame the clouds are stored in: the robot base at the moment the
    # experience was created. The sensor->base offset is applied once, on
    # arrival; the map pose is applied only when publishing.
    base_frame: base_link
    # Used only when base_frame <- sensor frame is missing from TF.
    sensor_mount_xyz: [0.0, 0.0, 0.3]
    sensor_mount_rpy: [0.0, 0.0, 0.0]
    # Overview cloud in /map: all experiences coalesced and voxelized again.
    global_cloud_voxel_size: 0.30   # 0 disables the extra downsampling
    cloud_publish_period: 5.0       # s between coalesced republishes
    # One marker per experience, so single clouds can be toggled in RViz.
    marker_namespace_chunk: 100
    marker_refresh_period: 30.0     # s, re-sends markers whose pose changed
    marker_point_size: 0.05         # m, RViz point size for the keyframe markers
    # Height band kept in each keyframe cloud, in the base frame (floor ~ 0,
    # sensor at 0.3 m). Discards floor and ceiling points that only clutter the
    # view. Set keyframe_z_max <= keyframe_z_min to disable the filter.
    keyframe_z_min: 0.6
    keyframe_z_max: 0.7
